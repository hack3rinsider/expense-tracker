name: Build, Push and Update Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            stardust96/expense-tracker:${{ github.sha }}

      - name: Update deployment.yaml
        run: |
          sed -i "s|image: .*|image: stardust96/expense-tracker:${GITHUB_SHA}|" k8s/deployment.yaml

      - name: Commit manifest
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "Update image ${GITHUB_SHA}"
          git push
