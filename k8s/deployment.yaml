apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
      - name: expense-tracker
        image: stardust96/expense-tracker:43fb6e2e2381ba82a922b9a0a68a0d00232761a1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
