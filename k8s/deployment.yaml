apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
      - name: expense-tracker
        image: stardust96/expense-tracker:cad1ecde3fb78571b41f3671ec30e6a8203842ef
        imagePullPolicy: Always
        ports:
        - containerPort: 80
