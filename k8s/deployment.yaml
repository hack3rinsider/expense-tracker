apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
      - name: expense-tracker
        image: stardust96/expense-tracker:0b1527254601a95740574cb702ef433a2641654a
        imagePullPolicy: Always
        ports:
        - containerPort: 80
