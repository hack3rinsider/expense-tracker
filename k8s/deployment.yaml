apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
    spec:
      containers:
      - name: expense-tracker
        image: stardust96/expense-tracker:5e70ba824d6e7bd9e9d57ef95773d0fca8f5e777
        imagePullPolicy: Always
        ports:
        - containerPort: 80
